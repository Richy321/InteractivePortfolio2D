name = "portfolio-multiplayer"
main = "src/index.js"
compatibility_date = "2025-07-01"

[durable_objects]
bindings = [{ name = "ROOM", class_name = "PortfolioRoom" }]

# new_sqlite_classes rather than new_classes: SQLite-backed Durable Objects are
# the ones included on the Workers free plan. The room keeps no durable state
# anyway - it is a relay - so there is nothing to lose by using them.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["PortfolioRoom"]
